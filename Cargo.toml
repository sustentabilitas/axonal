[package]
name = "axonal"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A fast, simple monorepo task runner for pnpm and Cargo workspaces"
repository = "https://github.com/sustentabilitas/axonal"
readme = "README.md"
keywords = ["monorepo", "build", "cache", "pnpm", "cargo"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
oxc_allocator = "0.152"
oxc_parser = "0.152"
oxc_span = "0.152"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tap = "1"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync"] }
toml = "1"
zstd = "0.14"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
